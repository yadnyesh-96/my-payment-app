
name: Payment App CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: "25"
          cache: maven

      - name: Run Maven tests
        run: ./mvnw --batch-mode --no-transfer-progress clean test
